<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Pipeline TexasWin</title>
  <meta name="theme-color" content="#007d89" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- ── Écran connexion ── -->
    <section id="login-view" class="view">
      <header class="brand">
        <span class="mark">T</span>
        <div>
          <h1>Pipeline TexasWin</h1>
          <p class="sub">Prototype PWA — client autonome</p>
        </div>
      </header>

      <form id="login-form" class="card" autocomplete="on">
        <label class="field">
          <span>API</span>
          <input id="api-base" type="url" inputmode="url" spellcheck="false"
                 placeholder="https://crm.texaswin.fr/api" />
        </label>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" autocomplete="username" required placeholder="vous@texaswin.fr" />
        </label>
        <label class="field">
          <span>Mot de passe</span>
          <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••" />
        </label>
        <button id="login-btn" type="submit" class="btn btn-primary">Se connecter</button>
        <p id="login-error" class="error" hidden></p>
        <p class="hint">Le token JWT reste en mémoire de l'onglet (jamais mis en cache). L'API n'est jamais mise en cache.</p>
      </form>
    </section>

    <!-- ── Écran liste sociétés ── -->
    <section id="list-view" class="view" hidden>
      <header class="topbar">
        <div class="who">
          <span class="mark small">T</span>
          <div>
            <strong id="who-name">—</strong>
            <span id="who-api" class="api-chip">—</span>
          </div>
        </div>
        <button id="logout-btn" class="btn btn-ghost">Déconnexion</button>
      </header>

      <div class="stats">
        <div class="stat"><div class="n" id="stat-societes">—</div><div class="k">Sociétés</div></div>
        <div class="stat"><div class="n" id="stat-clients">—</div><div class="k">Clients</div></div>
      </div>

      <div class="list-head">
        <h2>Sociétés</h2>
        <input id="search" type="search" placeholder="Filtrer nom / ville…" />
      </div>

      <div id="societes" class="list" aria-live="polite">
        <div class="empty">Chargement…</div>
      </div>
    </section>

    <!-- ── Écran fiche société ── -->
    <section id="fiche-view" class="view" hidden>
      <header class="topbar">
        <button id="back-btn" class="btn btn-ghost">‹ Sociétés</button>
        <button id="logout-btn2" class="btn btn-ghost">Déconnexion</button>
      </header>

      <div class="fiche-head card">
        <div class="fiche-title">
          <span id="fiche-avatar" class="avatar big">?</span>
          <div class="min0">
            <h2 id="fiche-name">—</h2>
            <div id="fiche-sub" class="fiche-sub">—</div>
          </div>
          <span id="fiche-tag" class="tag"></span>
        </div>
      </div>

      <nav id="tabs" class="tabs" role="tablist"></nav>
      <div id="tab-panel" class="tab-panel" aria-live="polite"></div>
    </section>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="./app.js"></script>
</body>
</html>
